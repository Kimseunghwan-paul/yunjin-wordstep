name: Deploy mobile download page
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: wordstep-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read actual latest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py latest --output build/latest-release.json
      - name: Generate page for the published APK
        run: python scripts/make-pages.py --metadata build/latest-release.json --repository "$GITHUB_REPOSITORY" --destination build/pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
      - id: deployment
        uses: actions/deploy-pages@v4
